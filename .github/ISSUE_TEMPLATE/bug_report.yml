name: Report a problem
description: Something in the app doesn't work as expected.
title: "[Problem]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. Issues here are **public**, so please don't include personal information.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the Catalog tab
        2. Tap ...
        3. See ...
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - iPhone
        - Android
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and OS version
      placeholder: e.g. iPhone 16, iOS 27.0.1 / Pixel 8, Android 16
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: App version
      description: Shown at the bottom of the Infinite Red tab, under "About this app".
      placeholder: e.g. 1.0.0
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots (optional)
      description: Drag images here. Leave out anything you don't want to share publicly.
